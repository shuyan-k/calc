<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="计算器">
<meta name="theme-color" content="#F7F7F9">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>计算器</title>
<style>
  :root {
    --c-bg: #F7F7F9;
    --c-card: #FFFFFF;
    --c-text: #111111;
    --c-text-sub: #8E8E93;
    --c-border: #EFEFF2;
    --c-accent: #007AFF;
    --c-num: #111111;
    --c-op: #007AFF;
    --c-func: #FF9500;
    --c-var: #34C759;
    --c-userfn: #AF52DE;
    --radius-lg: 20px;
    --radius-md: 16px;
    --shadow-card: 0 6px 16px rgba(0,0,0,0.05);
    --shadow-btn: 0 4px 10px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--c-bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
    padding-top: env(safe-area-inset-top);
    background: var(--c-bg);
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
    padding: 12px 16px 16px;
    flex-direction: column;
    width: 100%;
  }
  .screen.active { display: flex; }
  #screen-sci .display { margin-top: auto; }
  #screen-sci .pad { margin-bottom: auto; }
  .card {
    background: var(--c-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
    margin-bottom: 12px;
    width: 100%;
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--c-text-sub);
    letter-spacing: 0.6px;
    margin: 0 0 10px 2px;
    text-transform: uppercase;
  }

  /* 显示区 */
  .display { padding: 10px 16px 14px; }
  .display-head { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .angle-toggle {
    background: #F2F2F7; border: none; color: var(--c-accent);
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px;
    letter-spacing: 0.5px; font-family: inherit;
  }
  .expr {
    font-size: 32px; font-weight: 300; text-align: center;
    word-break: break-all; overflow-wrap: anywhere; line-height: 1.15; min-height: 38px;
    color: var(--c-text); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .hl-num { color: var(--c-num); }
  .hl-op { color: var(--c-op); font-weight: 500; }
  .hl-func { color: var(--c-func); font-weight: 500; }
  .hl-var { color: var(--c-var); font-weight: 600; }
  .hl-userfn { color: var(--c-userfn); font-weight: 600; }
  .result {
    font-size: 17px; color: var(--c-text-sub); text-align: center;
    min-height: 22px; margin-top: 2px; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all;
  }
  .result.error { color: #FF3B30; }
  .precision-hint {
    color: var(--c-text-sub); font-size: 10px; text-align: center; margin-top: 5px;
  }

  /* 键盘 */
  .pad {
    display: grid; grid-template-columns: minmax(0, 1fr);
    gap: 12px; width: 100%;
  }
  .science-pad {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: minmax(48px, 1fr); gap: 8px;
  }
  .number-pad {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: minmax(48px, 1fr); gap: 8px;
  }
  .key {
    background: var(--c-card); border: 1px solid rgba(17,17,17,0.025);
    border-radius: 15px; box-shadow: 0 3px 9px rgba(0,0,0,0.045);
    font-family: inherit; font-size: 20px;
    font-weight: 500; color: var(--c-text); min-height: 52px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.08s, background 0.08s;
    font-variant-numeric: tabular-nums; padding: 0;
  }
  .key:active { transform: scale(0.95); background: #F2F2F7; }
  .key.num { color: var(--c-num); }
  .key.op { color: var(--c-op); background: #EAF3FF; font-size: 22px; font-weight: 600; }
  .key.func { color: #D97706; background: #FFF5E8; font-size: 16px; font-weight: 600; }
  .key.var { color: #1C9B45; background: #EAF8EE; font-size: 18px; }
  .key.warn { color: #E53935; background: #FFF0EF; font-size: 18px; }
  .key.eq {
    background: linear-gradient(135deg, #1687FF, #0066D6);
    color: #fff; font-weight: 700; box-shadow: 0 5px 12px rgba(0,122,255,0.22);
  }
  .key.eq:active { background: #0062CC; }
  .key.span2 { grid-column: span 2; }
  .key.span4 { grid-column: span 4; }
  .key sup { font-size: 0.68em; line-height: 0; }
  .science-pad .key {
    min-height: 0; background: var(--c-card); border-color: rgba(17,17,17,0.025);
  }

  /* 函数定义行 */
  .fn-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #F2F2F7;
  }
  .fn-row:last-child { border-bottom: none; }
  .fn-name {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--c-userfn);
    min-width: 42px;
  }
  .fn-eq {
    color: var(--c-text-sub);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 16px;
  }
  .fn-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 16px;
    color: var(--c-text);
    padding: 4px 0;
    min-width: 0;
  }
  .btn-del {
    background: none; border: none; color: #C7C7CC;
    font-size: 18px; padding: 0 4px; cursor: pointer; flex-shrink: 0;
  }
  .btn-add {
    background: #F2F2F7; border: none; color: var(--c-accent);
    font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 12px;
    width: 100%; margin-top: 8px; font-family: inherit; cursor: pointer;
  }
  .btn-add:active { background: #E5E5EA; }
  .fn-hint {
    font-size: 11px;
    color: #C7C7CC;
    margin-top: 6px;
    line-height: 1.5;
  }
  .fn-hint code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--c-text-sub);
    background: #F2F2F7;
    padding: 1px 4px;
    border-radius: 4px;
  }

  /* 绘图 */
  .graph-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
  }
  .color-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .graph-label {
    font-size: 16px; font-weight: 600; color: var(--c-text-sub);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; flex-shrink: 0;
  }
  .graph-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 16px; font-weight: 500; color: var(--c-text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    padding: 4px 0; min-width: 0;
  }
  .graph-input-error {
    color: #FF3B30; font-size: 12px; min-height: 0; line-height: 1.4;
  }
  .graph-input-error:not(:empty) { padding: 0 0 6px 20px; }
  .graph-card { padding: 8px; }
  #graphCanvas {
    display: block; width: 100%; height: 380px;
    border-radius: 14px; touch-action: none;
  }
  .graph-actions { display: flex; gap: 8px; }
  .graph-actions button {
    flex: 1; background: var(--c-card); border: none; border-radius: 14px;
    box-shadow: var(--shadow-btn); font-family: inherit; font-size: 15px;
    font-weight: 500; color: var(--c-accent); min-height: 46px; cursor: pointer;
  }
  .graph-actions button:active { background: #F2F2F7; }

  /* 进制 */
  .base-row {
    display: flex; align-items: center; padding: 12px 0;
    border-bottom: 1px solid #F2F2F7;
  }
  .base-row:last-child { border-bottom: none; }
  .base-label {
    width: 52px; font-size: 13px; font-weight: 700; color: var(--c-text-sub);
    letter-spacing: 0.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .base-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 22px; font-weight: 500; color: var(--c-text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    text-align: center; line-height: 1.25; word-break: break-all;
    overflow-wrap: anywhere; white-space: pre-wrap; resize: none;
    overflow: hidden; min-width: 0; min-height: 28px; height: 28px; padding: 0;
  }
  .base-hint { font-size: 12px; color: #C7C7CC; text-align: center; padding: 8px 0 0; }
  .base-hint.error { color: #FF3B30; }

  /* Tab Bar */
  .tabbar {
    display: flex; background: var(--c-card); border-top: 1px solid var(--c-border);
    padding-bottom: env(safe-area-inset-bottom); width: 100%; max-width: 500px;
    margin: 0 auto;
  }
  .tabbar button {
    flex: 1; background: none; border: none; padding: 8px 0 6px;
    font-family: inherit; font-size: 11px; font-weight: 500;
    color: var(--c-text-sub); display: flex; flex-direction: column;
    align-items: center; gap: 3px; cursor: pointer;
  }
  .tabbar button.active { color: var(--c-accent); }
  .tabbar .ico { font-size: 19px; line-height: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 科学计算 ===== -->
  <section class="screen active" id="screen-sci">
    <div class="display card">
      <div class="display-head">
        <button class="angle-toggle" id="angleToggle">RAD</button>
      </div>
      <div class="expr" id="expr">0</div>
      <div class="result" id="result"></div>
      <div class="precision-hint">整数四则运算精确；小数和函数结果为近似值</div>
    </div>
    <div class="pad">
      <div class="science-pad">
        <button class="key func" data-ins="sin(">sin</button>
        <button class="key func" data-ins="cos(">cos</button>
        <button class="key func" data-ins="tan(">tan</button>
        <button class="key op" data-ins="^" aria-label="x 的 y 次方">x<sup>y</sup></button>
        <button class="key func" data-ins="ln(">ln</button>
        <button class="key func" data-ins="log(">log</button>
        <button class="key func" data-ins="sqrt(">√</button>
        <button class="key func" data-ins="^(1/" aria-label="y 次根"><sup>y</sup>√x</button>
        <button class="key func" data-ins="1/(" aria-label="倒数 1 除以 x">x<sup>−1</sup></button>
        <button class="key op" data-ins="%" aria-label="取余">mod</button>
        <button class="key func" data-ins="e">e</button>
        <button class="key func" data-ins="pi">π</button>
        <button class="key op" data-ins="(">(</button>
        <button class="key op" data-ins=")">)</button>
        <button class="key warn" data-action="clear">C</button>
        <button class="key func" data-action="back">⌫</button>
      </div>
      <div class="number-pad">
        <button class="key num" data-ins="7">7</button>
        <button class="key num" data-ins="8">8</button>
        <button class="key num" data-ins="9">9</button>
        <button class="key op" data-ins="+">+</button>
        <button class="key num" data-ins="4">4</button>
        <button class="key num" data-ins="5">5</button>
        <button class="key num" data-ins="6">6</button>
        <button class="key op" data-ins="-">−</button>
        <button class="key num" data-ins="1">1</button>
        <button class="key num" data-ins="2">2</button>
        <button class="key num" data-ins="3">3</button>
        <button class="key op" data-ins="*">×</button>
        <button class="key num span2" data-ins="0">0</button>
        <button class="key num" data-ins=".">.</button>
        <button class="key op" data-ins="/">÷</button>
        <button class="key eq span4" data-action="equals">=</button>
      </div>
    </div>
  </section>

  <!-- ===== 函数绘图 ===== -->
  <section class="screen" id="screen-graph">
    <div class="card">
      <div class="section-title">函数定义</div>
      <div id="fnList"></div>
      <button class="btn-add" id="addFn">+ 添加函数</button>
      <div class="fn-hint">
        可用 <code>d(f, x)</code> 求 f 在 x 处的导数，<code>i(f, a, b)</code> 求定积分。
      </div>
    </div>

    <div class="card">
      <div class="section-title">绘图曲线</div>
      <div id="graphList"></div>
      <button class="btn-add" id="addGraphFn">+ 添加曲线</button>
    </div>

    <div class="card graph-card">
      <canvas id="graphCanvas"></canvas>
    </div>
    <div class="graph-actions">
      <button id="zoomIn">＋ 放大</button>
      <button id="zoomOut">－ 缩小</button>
      <button id="resetView">重置</button>
    </div>
  </section>

  <!-- ===== 进制转换 ===== -->
  <section class="screen" id="screen-base">
    <div class="card">
      <div class="base-row">
        <span class="base-label">DEC</span>
        <textarea class="base-input" id="in-dec" inputmode="numeric" spellcheck="false"
                  autocapitalize="off" autocorrect="off" autocomplete="off" rows="1">255</textarea>
      </div>
      <div class="base-row">
        <span class="base-label">HEX</span>
        <textarea class="base-input" id="in-hex" spellcheck="false"
                  autocapitalize="characters" autocorrect="off" autocomplete="off" rows="1">FF</textarea>
      </div>
      <div class="base-row">
        <span class="base-label">OCT</span>
        <textarea class="base-input" id="in-oct" inputmode="numeric" spellcheck="false"
                  autocapitalize="off" autocorrect="off" autocomplete="off" rows="1">377</textarea>
      </div>
      <div class="base-row">
        <span class="base-label">BIN</span>
        <textarea class="base-input" id="in-bin" inputmode="numeric" spellcheck="false"
                  autocapitalize="off" autocorrect="off" autocomplete="off" rows="1">11111111</textarea>
      </div>
    </div>
    <div class="base-hint">输入上限 64 位；转换结果可更长，空格用于分组</div>
  </section>

  <nav class="tabbar">
    <button data-tab="sci" class="active"><span class="ico">∑</span>科学</button>
    <button data-tab="graph"><span class="ico">📈</span>绘图</button>
    <button data-tab="base"><span class="ico">01</span>进制</button>
  </nav>
</div>

<script src="./app.js"></script>
</body>
</html>
